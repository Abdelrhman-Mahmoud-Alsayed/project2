<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Tasks</title>
<style>
  :root {
    --bg: #eef2f1; --panel: #ffffff; --ink: #14302b; --muted: #5d7570;
    --line: #d3dedb; --accent: #0f766e; --high: #b4412f; --medium: #a8741a; --low: #4b7f52;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .stats { display: flex; gap: 12px; margin-bottom: 20px; }
  .stats div { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .stats b { display: block; font-size: 1.5rem; }
  .stats span { color: var(--muted); font-size: .85rem; }
  form { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  input, select, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  input[type=text] { flex: 1; min-width: 160px; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); padding: 4px 10px; }
  :focus-visible { outline: 3px solid #5eead4; outline-offset: 1px; }
  .filters { display: flex; gap: 8px; margin-bottom: 14px; }
  .filters button { background: transparent; color: var(--ink); border-color: var(--line); }
  .filters button[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line);
       border-left-width: 5px; border-radius: 8px; padding: 10px 12px; }
  li.high { border-left-color: var(--high); } li.medium { border-left-color: var(--medium); } li.low { border-left-color: var(--low); }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  .title { flex: 1; word-break: break-word; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  .err { color: var(--high); min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>Pipeline tasks</h1>
  <p class="sub">Served by Node.js from inside a container, built by Jenkins.</p>

  <section class="stats" aria-label="Summary">
    <div><b id="s-total">0</b><span>Total</span></div>
    <div><b id="s-done">0</b><span>Done</span></div>
    <div><b id="s-pending">0</b><span>Pending</span></div>
  </section>

  <form id="form">
    <input type="text" id="title" placeholder="Add a task" maxlength="120" required aria-label="Task title">
    <select id="priority" aria-label="Priority">
      <option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option>
    </select>
    <button type="submit">Add task</button>
  </form>
  <div class="err" id="err" role="alert"></div>

  <div class="filters" id="filters">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="false" aria-pressed="false">Pending</button>
    <button data-f="true" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let filter = 'all';

  async function api(url, opts) {
    const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
    if (res.status === 204) return null;
    const data = await res.json();
    if (!res.ok) throw new Error((data.errors || [data.error]).join(', '));
    return data;
  }

  async function load() {
    const q = filter === 'all' ? '' : `&done=${filter}`;
    const [{ data }, stats] = await Promise.all([api(`/api/tasks?sort=createdAt&order=asc${q}`), api('/api/stats')]);
    $('s-total').textContent = stats.total;
    $('s-done').textContent = stats.done;
    $('s-pending').textContent = stats.pending;

    const list = $('list');
    list.innerHTML = '';
    if (!data.length) { list.innerHTML = '<li class="empty" style="display:block;border:0;background:none">No tasks here. Add one above.</li>'; return; }

    for (const t of data) {
      const li = document.createElement('li');
      li.className = `${t.priority} ${t.done ? 'done' : ''}`;
      const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: t.done });
      cb.setAttribute('aria-label', `Mark "${t.title}" as done`);
      cb.onchange = () => api(`/api/tasks/${t.id}`, { method: 'PATCH', body: JSON.stringify({ done: cb.checked }) }).then(load);
      const span = Object.assign(document.createElement('span'), { className: 'title', textContent: t.title });
      const del = Object.assign(document.createElement('button'), { className: 'ghost', textContent: 'Delete' });
      del.onclick = () => api(`/api/tasks/${t.id}`, { method: 'DELETE' }).then(load);
      li.append(cb, span, del);
      list.append(li);
    }
  }

  $('form').onsubmit = async (e) => {
    e.preventDefault();
    $('err').textContent = '';
    try {
      await api('/api/tasks', { method: 'POST', body: JSON.stringify({ title: $('title').value, priority: $('priority').value }) });
      $('title').value = '';
      load();
    } catch (err) { $('err').textContent = err.message; }
  };

  $('filters').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('#filters button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    load();
  };

  load();
</script>
</body>
</html>
